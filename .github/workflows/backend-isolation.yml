name: Backend tenant isolation

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-isolation.yml'

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wattaman
          POSTGRES_PASSWORD: wattaman
          POSTGRES_DB: wattaman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wattaman -d wattaman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://wattaman:wattaman@localhost:5432/wattaman_test?schema=public
      DATABASE_ADMIN_URL: postgresql://wattaman:wattaman@localhost:5432/wattaman_test?schema=public
      RLS_RUNTIME_DATABASE_URL: postgresql://wattaman_runtime_e2e:IdentityTest123!@localhost:5432/wattaman_test?schema=public&options=-c%20role%3Dwattaman_school_runtime
      RLS_CONTROL_PLANE_DATABASE_URL: postgresql://wattaman_control_e2e:IdentityTest123!@localhost:5432/wattaman_test?schema=public&options=-c%20role%3Dwattaman_control_plane
      JWT_SECRET: isolation-ci-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - run: npm run db:roles:provision
      - run: npm run build
      - run: npm run test:isolation
        env:
          DATABASE_URL: ${{ env.RLS_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ env.RLS_CONTROL_PLANE_DATABASE_URL }}
      - run: npm run test:database-scope
      - run: npm run test:database-identities
      - run: npm run db:rls:activate
      - run: npm run test:rls
      - run: npm run test:lifecycle
        env:
          DATABASE_URL: ${{ env.RLS_RUNTIME_DATABASE_URL }}
          CONTROL_PLANE_DATABASE_URL: ${{ env.RLS_CONTROL_PLANE_DATABASE_URL }}
